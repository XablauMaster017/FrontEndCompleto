<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 04 — Infinity Bank</title>
    <style>
        :root {
            --bg: #0f1117;
            --bg-alt: #0a0c12;
            --surface: #171923;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text: #e4e6eb;
            --text-dim: #9ca3af;
            --text-faint: #6b7280;
            --accent: #7c5cff;
            --accent-hover: #6b4fea;
            --accent-glow: rgba(124, 92, 255, 0.28);
            --radius: 14px;
            --radius-sm: 9px;
            --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124, 92, 255, 0.12) 0%, transparent 60%),
                var(--bg);
            color: var(--text);
            padding: 28px 20px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .nav {
            width: 100%;
            max-width: 560px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 13px;
        }

        .nav a, .nav span.disabled {
            color: var(--text-dim);
            text-decoration: none;
            padding: 8px 13px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav a:hover {
            color: var(--text);
            border-color: var(--border-strong);
            transform: translateY(-1px);
        }

        .nav span.disabled { opacity: 0.35; cursor: not-allowed; }
        .nav-arrows { display: flex; gap: 8px; }

        .card {
            width: 100%;
            max-width: 560px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.04) inset,
                0 30px 60px -20px rgba(0, 0, 0, 0.6);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 13px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.015);
        }

        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .dot:nth-child(1) { background: #ff5f57; }
        .dot:nth-child(2) { background: #febc2e; }
        .dot:nth-child(3) { background: #28c840; }

        .badge {
            margin-left: auto;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        .card-body { padding: 30px 32px 32px; }

        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 4px;
        }

        .subtitle { font-size: 13px; color: var(--text-dim); }

        .divider-line {
            width: 38px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent);
            border-radius: 2px;
            margin: 14px 0 28px;
        }

        .field { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--text-faint);
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-alt);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
        }

        input::placeholder { color: var(--text-faint); }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'%3e%3cpath fill='%239ca3af' d='M6 8L0 0h12z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 36px;
        }

        select option {
            background: var(--bg-alt);
            color: var(--text);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
            margin-top: 4px;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -6px var(--accent-glow);
        }

        button:active { transform: translateY(0); }

        .result {
            margin-top: 24px;
            padding: 18px 20px;
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            animation: fadeIn 240ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result.hidden { display: none; }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 13px;
        }

        .result-item:last-child { border-bottom: none; }

        .result-item span:first-child {
            color: var(--text-dim);
            font-weight: 500;
        }

        .result-item span:last-child {
            color: var(--text);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .result-item.total {
            padding-top: 14px;
            margin-top: 6px;
            border-top: 1px solid var(--border-strong);
            border-bottom: none;
        }

        .result-item.total span:first-child {
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
        }

        .result-item.total span:last-child {
            color: var(--accent);
            font-size: 18px;
            font-weight: 700;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="00-instrucoes.html">← Instruções</a>
        <div class="nav-arrows">
            <a href="exc03.html">◀ Anterior</a>
            <a href="exc05.html">Próximo ▶</a>
        </div>
    </nav>

    <main class="card">
        <div class="card-header">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="badge">Exercício 04</span>
        </div>

        <div class="card-body">
            <h1>Infinity Bank</h1>
            <p class="subtitle">Simulador de taxas e juros para vendas parceladas.</p>
            <div class="divider-line"></div>

            <div class="field">
                <label for="cardBrand">Bandeira do Cartão</label>
                <select id="cardBrand">
                    <option value="">Selecione uma bandeira</option>
                    <option value="visa">Visa (2%)</option>
                    <option value="mastercard">Mastercard (1.85%)</option>
                    <option value="elo">Elo (3%)</option>
                </select>
            </div>

            <div class="field">
                <label for="amount">Valor da Venda (R$)</label>
                <input type="number" id="amount" min="0" step="0.01" placeholder="0.00">
            </div>

            <div class="field">
                <label for="installments">Número de Parcelas</label>
                <input type="number" id="installments" min="1" max="12" value="1" placeholder="1">
            </div>

            <button id="calculateBtn">Calcular Simulação</button>

            <div id="result" class="result hidden">
                <div class="result-item">
                    <span>Taxa da Bandeira</span>
                    <span id="brandTax">R$ 0,00</span>
                </div>
                <div class="result-item">
                    <span>Juros Mensais</span>
                    <span id="interests">R$ 0,00</span>
                </div>
                <div class="result-item">
                    <span>Taxa Fixa (R$ 12,50/mês)</span>
                    <span id="fixedFee">R$ 0,00</span>
                </div>
                <div class="result-item total">
                    <span>Valor da Parcela</span>
                    <span id="installmentValue">R$ 0,00</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const fmt = (n) => 'R$ ' + n.toFixed(2).replace('.', ',');

        document.getElementById('calculateBtn').addEventListener('click', function () {
            const cardBrand = document.getElementById('cardBrand').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const installments = parseInt(document.getElementById('installments').value);

            const result = document.getElementById('result');

            if (!cardBrand) { alert('Selecione uma bandeira'); return; }
            if (isNaN(amount) || amount <= 0) { alert('Digite um valor válido'); return; }
            if (isNaN(installments) || installments < 1) { alert('Digite o número de parcelas'); return; }

            let brandFeeRate;
            switch (cardBrand) {
                case 'visa': brandFeeRate = 0.02; break;
                case 'mastercard': brandFeeRate = 0.0185; break;
                case 'elo': brandFeeRate = 0.03; break;
                default: brandFeeRate = 0;
            }

            const brandTaxValue = amount * brandFeeRate;
            const interestTotal = amount * (0.015 * installments);
            const fixedFeeValue = 12.50 * installments;
            const totalValue = amount + brandTaxValue + interestTotal + fixedFeeValue;
            const installmentValue = totalValue / installments;

            document.getElementById('brandTax').textContent = fmt(brandTaxValue);
            document.getElementById('interests').textContent = fmt(interestTotal);
            document.getElementById('fixedFee').textContent = fmt(fixedFeeValue);
            document.getElementById('installmentValue').textContent = fmt(installmentValue);

            result.classList.remove('hidden');
        });
    </script>
</body>
</html>
